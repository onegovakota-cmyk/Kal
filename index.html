<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Kal Editor</title>
  <style>
    html,body{height:100%;margin:0;background:#0b0b14;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:1000px;margin:0 auto;padding:14px;display:grid;grid-template-columns:360px 1fr;gap:14px}
    @media(max-width:900px){.wrap{grid-template-columns:1fr}}
    .panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px}
    h2{margin:0 0 10px;font-size:14px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .badge{font-size:12px;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:4px 8px;opacity:.85;white-space:nowrap}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
    .row.one{grid-template-columns:1fr}
    label{display:block;font-size:12px;opacity:.75;margin:0 0 6px}
    .ctrl{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:10px}
    input[type=color]{width:42px;height:34px;border:0;background:transparent;padding:0}
    input[type=range]{width:100%}
    input[type=number]{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;color:#fff;padding:9px 10px;outline:none}
    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    button{cursor:pointer;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;font-weight:900;padding:10px 12px}
    button.primary{border-color:rgba(120,90,255,.55);background:rgba(120,90,255,.22)}
    .hint{font-size:12px;opacity:.7;line-height:1.35;margin-top:10px}
    .preview{display:flex;align-items:center;justify-content:center;min-height:540px}
    iframe{border:0;background:transparent;border-radius:18px}
    textarea{width:100%;height:300px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.35);color:#fff;padding:12px;box-sizing:border-box;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.35}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h2><span>Редактор</span><span class="badge">Kal / GitHub Pages</span></h2>

      <div class="row">
        <div>
          <label>Корпус</label>
          <div class="ctrl">
            <input type="color" id="frame" value="#7b4dff"/>
            <input type="range" id="frameA" min="0" max="100" value="16"/>
          </div>
        </div>
        <div>
          <label>Обводка</label>
          <div class="ctrl">
            <input type="color" id="frameBorder" value="#ffffff"/>
            <input type="range" id="frameBorderA" min="0" max="100" value="14"/>
          </div>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Экран фон</label>
          <div class="ctrl">
            <input type="color" id="dispBg" value="#140a2d"/>
            <input type="range" id="dispBgA" min="0" max="100" value="55"/>
          </div>
        </div>
        <div>
          <label>Экран текст</label>
          <div class="ctrl">
            <input type="color" id="dispText" value="#ede7ff"/>
            <input type="range" id="dispTextA" min="0" max="100" value="100"/>
          </div>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Кнопки фон</label>
          <div class="ctrl">
            <input type="color" id="keyBg" value="#19143c"/>
            <input type="range" id="keyBgA" min="0" max="100" value="55"/>
          </div>
        </div>
        <div>
          <label>Кнопки текст</label>
          <div class="ctrl">
            <input type="color" id="keyText" value="#ede7ff"/>
            <input type="range" id="keyTextA" min="0" max="100" value="100"/>
          </div>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Операторы фон</label>
          <div class="ctrl">
            <input type="color" id="opBg" value="#1e1455"/>
            <input type="range" id="opBgA" min="0" max="100" value="55"/>
          </div>
        </div>
        <div>
          <label>Равно фон</label>
          <div class="ctrl">
            <input type="color" id="eqBg" value="#ffdc5a"/>
            <input type="range" id="eqBgA" min="0" max="100" value="40"/>
          </div>
        </div>
      </div>

      <div class="row">
        <div>
          <label>AC фон</label>
          <div class="ctrl">
            <input type="color" id="acBg" value="#ff5a50"/>
            <input type="range" id="acBgA" min="0" max="100" value="35"/>
          </div>
        </div>
        <div>
          <label>Скругления</label>
          <div class="ctrl">
            <input type="number" id="radius" min="8" max="34" value="22"/>
            <input type="number" id="keyRadius" min="8" max="24" value="14"/>
          </div>
        </div>
      </div>

      <div class="row one">
        <div>
          <label>Размер iframe</label>
          <div class="ctrl">
            <input type="number" id="w" min="240" max="1200" value="360"/>
            <input type="number" id="h" min="280" max="1400" value="520"/>
          </div>
        </div>
      </div>

      <div class="btns">
        <button class="primary" id="gen">Получить iframe</button>
        <button id="copy">Скопировать</button>
      </div>

      <div class="hint">Код будет ссылаться на <b>calc.html</b> в твоём репозитории (GitHub Pages). В Genially вставляешь только iframe.</div>

      <div style="margin-top:12px">
        <label>Готовый iframe</label>
        <textarea id="out" spellcheck="false"></textarea>
      </div>
    </div>

    <div class="panel">
      <h2><span>Предпросмотр</span><span class="badge">iframe → calc.html</span></h2>
      <div class="preview">
        <iframe id="prev" width="360" height="520"></iframe>
      </div>
      <div class="hint">Если предпросмотр работает тут — он будет работать и в Genially (потому что это тот же src).</div>
    </div>
  </div>

<script>
(function(){
  const $ = (id)=>document.getElementById(id);
  const ids = ["frame","frameA","frameBorder","frameBorderA","dispBg","dispBgA","dispText","dispTextA","keyBg","keyBgA","keyText","keyTextA","opBg","opBgA","eqBg","eqBgA","acBg","acBgA","radius","keyRadius","w","h"];
  const el = Object.fromEntries(ids.map(id=>[id,$(id)]));
  const prev = $("prev");
  const out = $("out");

  const hex = (v)=>String(v||"").replace("#","");
  const num = (v, d)=>{ const x=Number(v); return Number.isFinite(x)?x:d; };

  function buildCalcUrl(){
    // ВАЖНО: корректно работает и локально, и на GitHub Pages
    const url = new URL("calc.html", location.href);
    url.searchParams.set("frame", hex(el.frame.value));
    url.searchParams.set("frameA", num(el.frameA.value,16));
    url.searchParams.set("frameBorder", hex(el.frameBorder.value));
    url.searchParams.set("frameBorderA", num(el.frameBorderA.value,14));
    url.searchParams.set("dispBg", hex(el.dispBg.value));
    url.searchParams.set("dispBgA", num(el.dispBgA.value,55));
    url.searchParams.set("dispText", hex(el.dispText.value));
    url.searchParams.set("dispTextA", num(el.dispTextA.value,100));
    url.searchParams.set("keyBg", hex(el.keyBg.value));
    url.searchParams.set("keyBgA", num(el.keyBgA.value,55));
    url.searchParams.set("keyText", hex(el.keyText.value));
    url.searchParams.set("keyTextA", num(el.keyTextA.value,100));
    url.searchParams.set("opBg", hex(el.opBg.value));
    url.searchParams.set("opBgA", num(el.opBgA.value,55));
    url.searchParams.set("opText", hex(el.keyText.value));
    url.searchParams.set("opTextA", num(el.keyTextA.value,100));
    url.searchParams.set("eqBg", hex(el.eqBg.value));
    url.searchParams.set("eqBgA", num(el.eqBgA.value,40));
    url.searchParams.set("acBg", hex(el.acBg.value));
    url.searchParams.set("acBgA", num(el.acBgA.value,35));
    url.searchParams.set("radius", num(el.radius.value,22));
    url.searchParams.set("keyRadius", num(el.keyRadius.value,14));
    return url.toString();
  }

  function refresh(){
    const w = Math.max(240, num(el.w.value,360));
    const h = Math.max(280, num(el.h.value,520));
    prev.width = w; prev.height = h;
    prev.style.width = w+"px"; prev.style.height = h+"px";
    prev.src = buildCalcUrl();
  }

  function buildIframe(){
    const w = Math.max(240, num(el.w.value,360));
    const h = Math.max(280, num(el.h.value,520));
    const src = buildCalcUrl();
    return `<iframe src="${src}" style="width:${w}px;height:${h}px;border:0;background:transparent" width="${w}" height="${h}"></iframe>`;
  }

  ids.forEach(id=>el[id].addEventListener("input", ()=>{ refresh(); out.value=""; }));

  $("gen").addEventListener("click", ()=>{ out.value = buildIframe(); });

  $("copy").addEventListener("click", async ()=>{
    const txt = out.value || buildIframe();
    out.value = txt;
    try{ await navigator.clipboard.writeText(txt); alert("Скопировано"); }
    catch(e){ out.focus(); out.select(); document.execCommand("copy"); alert("Скопировано"); }
  });

  refresh();
})();
</script>
</body>
</html>
